<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b3b">
<title>Clara von Donau – Mobile Vorschau</title>
<style>
*{box-sizing:border-box}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#eaf0f1;color:#173b40}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.preview-tools{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:5}
.preview-tools strong{font-size:12px;white-space:nowrap;margin-right:6px}
.preview-tools button{border:1px solid #d5e4e4;border-radius:20px;background:#fff;color:#17494b;padding:9px 14px;min-height:44px;font-weight:700;cursor:pointer;touch-action:manipulation}
.preview-tools button[aria-pressed=true]{background:#176b68;color:#fff;border-color:#176b68}
.preview-shell{width:min(100%,430px);height:min(850px,calc(100dvh - 76px));min-height:min(560px,calc(100dvh - 76px));background:#123b3b;border:8px solid #123b3b;border-radius:34px;padding:5px;box-shadow:0 22px 70px #102b2540;overflow:hidden;position:relative;margin-top:34px;transition:width .2s,height .2s}
.preview-top{height:17px;display:flex;align-items:center;justify-content:center}
.preview-top span{display:block;width:74px;height:5px;border-radius:99px;background:#d8e4dc}
iframe{display:block;width:100%;height:calc(100% - 17px);border:0;border-radius:23px;background:#f4f7f7}
body.landscape .preview-shell{width:min(100%,920px);height:min(430px,calc(100dvh - 76px));min-height:min(300px,calc(100dvh - 76px))}
@media(max-width:600px){
 body{padding:calc(48px + env(safe-area-inset-top)) 0 0;display:block;background:#f8f7f1}
 .preview-tools{top:calc(6px + env(safe-area-inset-top));bottom:auto;left:50%;transform:translateX(-50%);background:#ffffffed;padding:5px;border-radius:24px;box-shadow:0 4px 18px #102b2528}
 .preview-tools strong{display:none}
 .preview-shell{width:100vw;height:calc(100dvh - 48px - env(safe-area-inset-top));min-height:0;border:0;border-radius:0;padding:0;box-shadow:none;margin:0}
 .preview-top{display:none}
 iframe{height:100%;border-radius:0}
 body.landscape .preview-shell{width:100vw;height:calc(100dvh - 48px - env(safe-area-inset-top));min-height:0}
}
</style>
</head>
<body>
<div class="preview-tools" role="group" aria-label="Ausrichtung der Vorschau wählen">
<strong>ANSICHT</strong>
<button id="portrait" type="button" aria-pressed="true" onclick="setOrientation('portrait')">↕ Hochformat</button>
<button id="landscape" type="button" aria-pressed="false" onclick="setOrientation('landscape')">↔ Querformat</button><span id="orientationStatus" class="sr-only" aria-live="polite">Hochformat ausgewählt</span>
</div>
<main class="preview-shell" aria-label="Clara mobile Website-Vorschau">
<div class="preview-top"><span></span></div>
<iframe src="./index.html" title="Clara von Donau – responsive mobile Website-Vorschau" loading="eager"></iframe>
</main>
<script>
function setOrientation(mode){
 document.body.classList.toggle('landscape',mode==='landscape');
 document.getElementById('portrait').setAttribute('aria-pressed',String(mode==='portrait'));
 document.getElementById('landscape').setAttribute('aria-pressed',String(mode==='landscape'));
 const status=document.getElementById('orientationStatus');if(status)status.textContent=mode==='landscape'?'Querformat ausgewählt':'Hochformat ausgewählt';
}
</script>
</body>
</html>
