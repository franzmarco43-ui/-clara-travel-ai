<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Clara von Donau – Mobile Vorschau</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#e8eee8;color:#173f35}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.preview-shell{width:min(100%,430px);height:min(900px,calc(100vh - 48px));min-height:620px;background:#102b25;border:8px solid #173f35;border-radius:34px;padding:5px;box-shadow:0 22px 70px #102b2540;overflow:hidden;position:relative}
.preview-top{height:17px;display:flex;align-items:center;justify-content:center}
.preview-top span{display:block;width:74px;height:5px;border-radius:99px;background:#d8e4dc}
iframe{display:block;width:100%;height:calc(100% - 17px);border:0;border-radius:23px;background:#f8f7f1}
.preview-label{position:fixed;left:50%;top:10px;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.03em;color:#496458;white-space:nowrap}
@media(max-width:600px){body{padding:0;background:#f8f7f1}.preview-label{display:none}.preview-shell{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0;padding:0;box-shadow:none}.preview-top{display:none}iframe{height:100%;border-radius:0}}
</style>
</head>
<body>
<div class="preview-label">MOBILE-VORSCHAU · 390–430 PX</div>
<main class="preview-shell" aria-label="Clara mobile website preview">
<div class="preview-top"><span></span></div>
<iframe src="./index.html" title="Clara von Donau – mobile Website" loading="eager"></iframe>
</main>
</body>
</html>
